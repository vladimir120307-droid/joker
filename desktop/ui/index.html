<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data: http: https:;">
<title>JOKER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="strip">
    <div id="tabs"></div>
    <button id="newtab" class="icon" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="bar">
    <button id="back" class="icon" title="Назад (Alt+←)" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <button id="fwd" class="icon" title="Вперёд (Alt+→)" aria-label="Вперёд">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <button id="reload" class="icon" title="Обновить (F5)" aria-label="Обновить">
      <svg id="ic-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg>
      <svg id="ic-stop" viewBox="0 0 24 24" hidden><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div id="omni">
      <span id="sec" class="sec"></span>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Введите запрос или адрес">
    </div>

    <button id="t-fs" class="toggle" title="Сообщать сайту, что окно открыто на весь экран (Ctrl+Shift+F)">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>Полный экран</span>
    </button>
    <button id="t-focus" class="toggle" title="Не сообщать сайту о переключении на другое окно или вкладку (Ctrl+Shift+H)">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Скрыть переключение</span>
    </button>
    <button id="menu" class="icon" title="Меню" aria-label="Меню">
      <svg viewBox="0 0 24 24" class="fill"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
  </div>

  <div id="find" hidden>
    <input id="find-q" type="text" spellcheck="false" placeholder="Найти на странице">
    <span id="find-n"></span>
    <button id="find-prev" class="icon sm" title="Предыдущее (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button id="find-next" class="icon sm" title="Следующее (Enter)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="find-close" class="icon sm" title="Закрыть (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
