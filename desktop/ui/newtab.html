<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая вкладка</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px "Segoe UI", system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { width: min(560px, 90vw); text-align: center; margin-top: -8vh; }
  .logo { display: block; width: 96px; height: 96px; margin: 0 auto 14px; }
  h1 { font-size: 40px; font-weight: 400; letter-spacing: -1px; margin: 0 0 28px; }
  form { display: flex; }
  input { flex: 1; height: 46px; border-radius: 23px; border: 1px solid GrayText; background: transparent; color: inherit; padding: 0 22px; font-size: 16px; outline: 0; }
  input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.3); }
  p { margin-top: 22px; color: GrayText; font-size: 13px; }
</style>
</head>
<body>
<main>
  <picture>
    <source media="(prefers-reduced-motion: reduce)" srcset="logo-static.png">
    <img class="logo" src="logo.png" width="96" height="96" alt="">
  </picture>
  <h1>JOKER</h1>
  <form action="https://www.google.com/search" method="get">
    <input name="q" type="text" placeholder="Поиск в Google или адрес сайта" autocomplete="off">
  </form>
  <p>Приватный режим: история, куки и кэш не сохраняются на диск.</p>
</main>
</body>
</html>
