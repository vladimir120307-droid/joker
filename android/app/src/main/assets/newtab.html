<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { width: min(560px, 90vw); text-align: center; margin-top: -10vh; }
  h1 { font-size: 34px; font-weight: 400; letter-spacing: -1px; margin: 0 0 24px; }
  input { box-sizing: border-box; width: 100%; height: 48px; border-radius: 24px; border: 1px solid GrayText; background: transparent; color: inherit; padding: 0 22px; font-size: 16px; outline: 0; }
  input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.3); }
  p { margin-top: 22px; color: GrayText; font-size: 13px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <h1>JOKER</h1>
  <form action="https://www.google.com/search" method="get">
    <input name="q" type="search" placeholder="Поиск в Google или адрес сайта" autocomplete="off" enterkeyhint="search">
  </form>
  <p>Приватный сеанс: cookie, кэш и данные сайтов удаляются при выходе.</p>
</main>
</body>
</html>
