name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  extension:
    name: Расширение и общая логика
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Синтаксис скриптов
        run: |
          for f in extension/*.js tests/extension/run.mjs tools/*.js desktop/*.js android/e2e/run.mjs android/app/src/main/assets/js/bridge.js; do
            node --check "$f"
          done
      - name: preload браузера соответствует extension/core.js
        run: node tools/sync-core.js --check
      - name: Собрать архивы расширения
        run: node tools/build-extension.js all
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи (если задан в секретах)
        env:
          KEYSTORE_BASE64: ${{ secrets.JOKER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "JOKER_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "JOKER_KEYSTORE_PASSWORD=${{ secrets.JOKER_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "JOKER_KEY_ALIAS=${{ secrets.JOKER_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "JOKER_KEY_PASSWORD=${{ secrets.JOKER_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Секретов подписи нет: APK будет подписан отладочным ключом"
          fi
      - name: Собрать APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/JOKER-release.apk

  release:
    name: Релиз
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Собрать файлы релиза
        run: |
          mkdir release
          cp artifacts/android-apk/JOKER-release.apk release/JOKER.apk
          cp artifacts/extension/*.zip release/
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
